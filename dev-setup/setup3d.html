<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dev Setup 3D · GSAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="setup3d.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="gl" aria-label="3D programmer setup"></canvas>

  <div class="loader" id="loader"><span>Loading…</span></div>

  <header class="nav">
    <a class="brand" href="index.html"><span class="hex">~/</span>dev-setup</a>
    <nav>
      <a href="index.html">2D Setup</a>
      <a href="setup3d.html" class="is-current">3D Setup</a>
    </nav>
  </header>

  <div class="title-block">
    <p class="eyebrow">development setup · Three.js · GSAP</p>
    <h1>My Dev <span>Setup</span></h1>
    <div class="modes" role="group" aria-label="Desk lighting">
      <button class="mode is-active" data-mode="focus">Focus</button>
      <button class="mode" data-mode="warm">Warm</button>
      <button class="mode" data-mode="night">Night</button>
      <button class="mode" data-mode="off">Off</button>
    </div>
  </div>

  <nav class="parts" id="parts" aria-label="Setup parts"></nav>

  <div class="hint" id="hint">Scroll / drag to spin around · click any part</div>
  <div class="tag" id="tag"></div>

  <!-- detail panel -->
  <aside class="panel" id="panel" aria-hidden="true">
    <button class="close" id="p-close" aria-label="Close details">✕</button>
    <p class="p-reveal p-cat" id="p-cat"></p>
    <h2 class="p-reveal" id="p-name"></h2>
    <p class="p-reveal p-tag" id="p-tag"></p>
    <p class="p-reveal p-price" id="p-price"></p>
    <dl class="p-reveal specs" id="p-specs"></dl>
    <div class="p-reveal stats" id="p-stats"></div>
    <div class="p-reveal actions">
      <button id="p-prev" class="ghost" aria-label="Previous part">←</button>
      <button id="p-next" class="ghost" aria-label="Next part">→</button>
      <button id="p-back" class="primary">Back to orbit</button>
    </div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>
  <script type="module" src="setup3d.js"></script>
</body>
</html>
